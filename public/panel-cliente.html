<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Panel — Green en la Casa Blanca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/componentes.css">
<link rel="stylesheet" href="assets/icons/icons.css">
<style>
  .panel-grid { display: grid; grid-template-columns: 260px 1fr; gap: 0; min-height: calc(100vh - 70px); }
  .panel-sidebar { background: var(--color-primary); color: #fff; padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .panel-sidebar .panel-brand { font-family: var(--font-heading); font-size: 1.35rem; letter-spacing: 2px; margin-bottom: 2rem; color: var(--color-accent); text-align: center; }
  .panel-sidebar a { display: block; padding: 0.75rem 1rem; border-radius: var(--radius-md); color: rgba(245,245,220,0.9); font-size: 0.95rem; transition: var(--transition); text-decoration: none; }
  .panel-sidebar a:hover, .panel-sidebar a.activo { background: rgba(245,245,220,0.15); color: #fff; }
  .panel-sidebar a.cerrar { color: rgba(168,54,54,0.9); margin-top: auto; }
  .panel-sidebar a.cerrar:hover { background: rgba(168,54,54,0.15); color: #a83636; }
  .panel-main { background: var(--color-bg); padding: 2rem var(--space-md); overflow-y: auto; }
  .panel-main h2 { font-size: 1.75rem; margin-bottom: 1.5rem; color: var(--color-primary); text-transform: uppercase; letter-spacing: 2px; }
  .panel-main .divisor { width: 60px; height: 3px; background: var(--color-accent); margin: 0 0 2rem 0; border-radius: 2px; }
  .panel-card { background: var(--color-surface); border: 1px solid rgba(27,67,50,0.12); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-sm); }
  .panel-card h3 { margin-top: 0; margin-bottom: 1rem; color: var(--color-primary); font-size: 1.15rem; text-transform: uppercase; letter-spacing: 1px; }
  .tabla-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid rgba(27,67,50,0.08); }
  th { background: rgba(46,95,78,0.08); color: var(--color-primary); font-weight: 700; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; }
  tr:hover { background: rgba(46,95,78,0.05); }
  .estado { padding: 0.25rem 0.6rem; border-radius: var(--radius-pill); font-size: 0.78rem; font-weight: 700; text-transform: uppercase; display: inline-block; }
  .estado--pendiente { background: rgba(184,134,11,0.12); color: #8a6200; }
  .estado--confirmada { background: rgba(46,95,78,0.12); color: #1e4a33; }
  .estado--completada { background: rgba(45,106,79,0.15); color: #2d6a4f; }
  .estado--cancelada { background: rgba(168,54,54,0.12); color: #a83636; }
  .estado--vencida { background: rgba(168,54,54,0.12); color: #a83636; }
  .estado--en_preparacion { background: rgba(46,95,78,0.12); color: #1e4a33; }
  .estado--listo { background: rgba(45,106,79,0.15); color: #2d6a4f; }
  .estado--entregado { background: rgba(45,106,79,0.15); color: #2d6a4f; }
  .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; border-radius: var(--radius-sm); }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
  .vacio { text-align: center; color: var(--color-text-muted); padding: 3rem; }
  .alerta { padding: 1rem; border-radius: var(--radius-md); margin-bottom: 1rem; font-size: 0.9rem; }
  .alerta--exito { background: rgba(45,106,79,0.1); color: #2d6a4f; border: 1px solid #2d6a4f; }
  .alerta--error { background: rgba(168,54,54,0.1); color: #a83636; border: 1px solid #a83636; }
  .btn-accion { background: var(--color-primary); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .btn-accion:hover { background: var(--color-secondary); }
  .btn-accion.sec { background: transparent; border: 1px solid var(--color-primary); color: var(--color-primary); }
  .btn-accion.sec:hover { background: var(--color-primary); color: #fff; }
  .btn-accion.danger { background: transparent; border: 1px solid #a83636; color: #a83636; }
  .btn-accion.danger:hover { background: #a83636; color: #fff; }
  select.estado-select { padding: 0.35rem; border-radius: var(--radius-sm); border: 1px solid rgba(27,67,50,0.15); font-size: 0.85rem; background: #fff; }
  .dias-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.75rem; }
  .dia-card { border: 1px solid rgba(27,67,50,0.12); border-radius: var(--radius-md); padding: 0.75rem; background: #fff; display: flex; flex-direction: column; gap: 0.4rem; }
  .dia-card h4 { margin: 0; font-size: 0.95rem; color: var(--color-primary); }
  .dia-card .hora-row { display: flex; gap: 0.4rem; align-items: center; }
  .dia-card input { flex: 1; padding: 0.35rem; border: 1px solid rgba(27,67,50,0.15); border-radius: var(--radius-sm); font-size: 0.85rem; }
  .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
  .stock-card { border: 1px solid rgba(27,67,50,0.12); border-radius: var(--radius-md); padding: 1rem; background: #fff; display: flex; flex-direction: column; gap: 0.5rem; }
  .stock-card h4 { margin: 0; font-size: 1rem; color: var(--color-primary); }
  .stock-card .row { display: flex; gap: 0.5rem; align-items: center; }
  .stock-card input { flex: 1; padding: 0.35rem; border: 1px solid rgba(27,67,50,0.15); border-radius: var(--radius-sm); font-size: 0.85rem; }
  .menu-semanal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
  .menu-semana-card { border: 1px solid rgba(27,67,50,0.12); border-radius: var(--radius-md); padding: 1rem; background: #fff; }
  .menu-semana-card h4 { margin: 0 0 0.5rem 0; color: var(--color-primary); }
  .menu-items { display: flex; flex-direction: column; gap: 0.4rem; max-height: 300px; overflow-y: auto; }
  .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem; border-bottom: 1px solid rgba(27,67,50,0.08); font-size: 0.85rem; }
  .menu-item:last-child { border-bottom: none; }
  .calendario { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.4rem; max-width: 720px; }
  .cal-dia-nombre { text-align: center; font-weight: 700; font-size: 0.85rem; color: var(--color-primary); text-transform: uppercase; letter-spacing: 0.5px; padding: 0.4rem 0; }
  .cal-dia { aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; cursor: pointer; transition: var(--transition); user-select: none; }
  .cal-dia.disponible { background: #e8f5e9; color: #1e4a33; border-color: #2d6a4f; }
  .cal-dia.disponible:hover { background: #c8e6c9; transform: scale(1.05); }
  .cal-dia.no-disponible { background: #f5f5f5; color: #bdbdbd; border-color: #e0e0e0; cursor: not-allowed; }
  .cal-dia.seleccionado { background: var(--color-accent); color: #fff; border-color: #8a6200; }
  .cal-dia.tiene-reserva { background: #fff8e1; color: #8a6200; border-color: #fbc02d; }
  .cal-dia.hoy { font-weight: 700; box-shadow: 0 0 0 3px rgba(46, 95, 78, 0.3); }
  .cal-semana { display: contents; }
  .cal-mes { font-family: var(--font-heading); font-size: 1.5rem; color: var(--color-primary); margin-bottom: 1rem; }
  .cal-nav { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
  .cal-btn { background: none; border: none; color: var(--color-primary); font-size: 1.2rem; cursor: pointer; padding: 0.2rem; }
  .cal-btn:hover { color: var(--color-secondary); }
  .legend { display: flex; gap: 1rem; font-size: 0.8rem; margin-bottom: 0.75rem; }
  .legend-item { display: flex; align-items: center; gap: 0.4rem; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .form-reserva input, .form-reserva select {
    background: #FAFAF0;
    border: 1px solid rgba(27, 67, 50, 0.15);
    border-radius: var(--radius-md);
    padding: 0.9rem;
    color: var(--color-text);
    font-family: inherit;
    font-size: 0.95rem;
    width: 100%;
  }
  .form-reserva input::placeholder { color: var(--color-text-muted); }
  .form-reserva input:focus, .form-reserva select:focus {
    outline: none;
    border-color: var(--color-accent);
    box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.1);
  }
  @media (max-width: 768px) { .panel-grid { grid-template-columns: 1fr; } .panel-sidebar { display: none; } }
</style>
</head>
<body>

<nav>
  <div class="nav-wrap">
    <a href="index.html" class="logo nav-brand">
      <img src="assets/icons/logo.png" alt="Logo Green en la Casa Blanca" width="40" height="40">
      <span class="logo-text">GREEN</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="carta.html">Carta</a></li>
      <li><a href="reservas.html">Reservar mesa</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>
    <div class="nav-acciones">
      <div id="nav-sesion"></div>
    </div>
  </div>
</nav>

<div class="panel-grid">
  <aside class="panel-sidebar">
    <div class="panel-brand">Cliente</div>
    <a href="#" class="activo" onclick="mostrar('mis-reservas')">Mis reservas</a>
    <a href="#" onclick="mostrar('nueva-reserva')">Nueva reserva</a>
    <a href="#" onclick="mostrar('mis-pedidos')">Mis pedidos</a>
    <a href="pedidos.html" style="margin-top:auto;">Pedir a domicilio</a>
    <a href="#" class="cerrar" onclick="cerrarSesion()">Cerrar sesión</a>
  </aside>
  <main class="panel-main">
    
    <!-- Mis reservas -->
    <section id="vista-mis-reservas" class="panel-card">
      <h3>Mis reservas</h3>
      <div id="alerta-mis-reservas" class="alerta" style="display:none;"></div>
      <div class="tabla-wrap" id="tabla-mis-reservas"></div>
    </section>

    <!-- Nueva reserva -->
    <section id="vista-nueva-reserva" class="panel-card" style="display:none;">
      <h3>Nueva reserva</h3>
      <p>Selecciona una fecha disponible (días verdes) y una hora para tu reserva.</p>
      <div id="alerta-nueva-reserva" class="alerta" style="display:none;"></div>
      <form id="form-nueva-reserva" class="form-reserva">
        <div class="form-grid">
          <div>
            <label for="fecha-reserva">Fecha</label>
            <input type="date" id="fecha-reserva" name="fecha" required>
          </div>
          <div>
            <label for="hora-reserva">Hora</label>
            <select id="hora-reserva" name="hora" required>
              <option value="">Seleccionar hora</option>
              <option value="12:00">12:00</option>
              <option value="13:30">13:30</option>
              <option value="15:00">15:00</option>
              <option value="19:00">19:00</option>
              <option value="20:30">20:30</option>
              <option value="22:00">22:00</option>
            </select>
          </div>
          <div style="grid-column: 1 / -1;">
            <label for="comensales-reserva">Número de comensales</label>
            <select id="comensales-reserva" name="comensales" required>
              <option value="1">1 persona</option>
              <option value="2">2 personas</option>
              <option value="3">3 personas</option>
              <option value="4">4 personas</option>
              <option value="5">5 personas</option>
              <option value="6">6 o más personas</option>
            </select>
          </div>
          <div style="grid-column: 1 / -1;">
            <label for="comentarios-reserva">Comentarios adicionales (opcional)</label>
            <textarea id="comentarios-reserva" name="comentarios" rows="3" placeholder="Alergias, preferencias de mesa, solicitudes especiales..."></textarea>
          </div>
        </div>
        <div id="mensaje-estado-reserva" class="mensaje-estado"></div>
        <button type="submit" class="btn btn-reserva">Crear reserva</button>
      </form>
      <div id="calendario-reserva" style="margin-top: 2rem;">
        <h4>Días disponibles</h4>
        <div class="calendario" id="grid-calendario-reserva"></div>
        <p id="fecha-seleccionada" style="margin-top: 1rem; color: var(--color-primary); font-weight: 700;"></p>
      </div>
    </section>

    <!-- Mis pedidos -->
    <section id="vista-mis-pedidos" class="panel-card" style="display:none;">
      <h3>Mis pedidos</h3>
      <div id="alerta-mis-pedidos" class="alerta" style="display:none;"></div>
      <div class="tabla-wrap" id="tabla-mis-pedidos"></div>
    </section>

  </main>
</div>

<script type="module" src="/assets/js/api.js?v=2"></script>
<script type="module" src="/assets/js/main.js"></script>
<script type="module">
  import { api } from '/assets/js/api.js';
  import { formatearMoneda, formatearFecha, formatearHora, mostrarToast, mostrarAlerta, setBtnLoading, confirmar } from '/assets/js/main.js';

  const DIAS_SEM = ['Do','Lu','Ma','Mi','Ju','Vi','Sá'];
  const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  let fechaSeleccionada = null;
  let disponibilidadDisponible = new Set();

  function mostrar(vista) {
    document.querySelectorAll('section').forEach(s => s.style.display = 'none');
    document.getElementById('vista-' + vista).style.display = 'block';
    if (vista === 'mis-reservas') cargarMisReservas();
    if (vista === 'nueva-reserva') { cargarDisponibilidad(); cargarCalendarioReserva(); }
    if (vista === 'mis-pedidos') cargarMisPedidos();
  }

  async function cerrarSesion() {
    try {
      await api.logout();
      mostrarToast('Sesión cerrada.', 'exito');
      setTimeout(() => { window.location.href = 'index.html'; }, 600);
    } catch (e) {
      window.location.href = 'index.html';
    }
  }

  function alerta(id, texto, tipo) {
    const el = document.getElementById(id);
    if (el) {
      el.textContent = texto;
      el.className = 'alerta alerta--' + tipo;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 5000);
    }
  }

  async function cargarMisReservas() {
    try {
      const r = await api.reservas();
      const datos = r.datos || [];
      const wrap = document.getElementById('tabla-mis-reservas');
      if (!datos.length) { wrap.innerHTML = '<p class="vacio">No tienes reservas.</p>'; return; }
      let html = '<table><thead><tr><th>Reserva</th><th>Fecha</th><th>Hora</th><th>Mesa</th><th>Estado</th><th>Acción</th></tr></thead><tbody>';
      datos.forEach(res => {
        const fin = res.hora_fin ? res.hora_fin.substring(0,5) : '';
        html += `<tr>
          <td>#${res.id_reserva}</td>
          <td>${res.fecha_reserva}</td>
          <td>${res.hora_inicio.substring(0,5)} - ${fin}</td>
          <td>Mesa ${res.id_mesa}</td>
          <td><span class="estado estado--${res.estado}">${res.estado}</span></td>
          <td>
            ${res.estado === 'pendiente' || res.estado === 'confirmada'
              ? `<button class="btn-sm btn-accion danger" onclick="cancelarReserva(${res.id_reserva})">Cancelar</button>`
              : ''
            }
          </td>
        </tr>`;
      });
      html += '</tbody></table>';
      wrap.innerHTML = html;
    } catch (e) {
      document.getElementById('tabla-mis-reservas').innerHTML = '<p class="vacio">No se pudieron cargar las reservas.</p>';
      console.error(e);
    }
  }

  window.cancelarReserva = async function (id) {
    if (!confirmar('¿Está seguro de cancelar esta reserva?')) return;
    const btn = event.currentTarget;
    setBtnLoading(btn, true);
    try {
      await api.cancelarReserva(id);
      mostrarToast('Reserva cancelada.', 'exito');
      cargarMisReservas();
    } catch (e) {
      mostrarAlerta('alerta-mis-reservas', e.message || 'Error al cancelar.', 'error');
    } finally {
      setBtnLoading(btn, false);
    }
  };

  async function cargarMisPedidos() {
    try {
      const r = await api.pedidos();
      const datos = r.datos || [];
      const wrap = document.getElementById('tabla-mis-pedidos');
      if (!datos.length) { wrap.innerHTML = '<p class="vacio">No tienes pedidos.</p>'; return; }
      let html = '<table><thead><tr><th>Pedido</th><th>Fecha</th><th>Estado</th><th>Total</th><th>Seña</th></tr></thead><tbody>';
      datos.forEach(p => {
        html += `<tr>
          <td>#${p.id_pedido}</td>
          <td>${p.fecha_pedido ? p.fecha_pedido.substring(0,16) : '-'}</td>
          <td><span class="estado estado--${p.estado}">${p.estado}</span></td>
          <td>$${(p.total || 0).toFixed(2)}</td>
          <td><span class="estado estado--${p.estado_seña || 'pendiente'}">${p.estado_seña || 'pendiente'}</span></td>
        </tr>`;
      });
      html += '</tbody></table>';
      wrap.innerHTML = html;
    } catch (e) {
      document.getElementById('tabla-mis-pedidos').innerHTML = '<p class="vacio">No se pudieron cargar los pedidos.</p>';
      console.error(e);
    }
  };

  async function cargarDisponibilidad() {
    try {
      const r = await api.disponibilidad();
      const datos = r.datos || [];
      disponibilidadDisponible = new Set(datos.map(d => d.fecha));
      renderCalendarioReserva();
    } catch (e) {
      console.error('disponibilidad', e);
    }
  }

  async function cargarCalendarioReserva() {
    const grid = document.getElementById('grid-calendario-reserva');
    grid.innerHTML = '';
    const hoy = new Date();
    hoy.setHours(0,0,0,0);
    const anio = hoy.getFullYear();
    const mes = hoy.getMonth();
    
    DIAS_SEM.forEach(d => {
      const n = document.createElement('div');
      n.className = 'cal-dia-nombre';
      n.textContent = d;
      grid.appendChild(n);
    });

    const primero = new Date(anio, mes, 1);
    const offset = primero.getDay();
    const diasEnMes = new Date(anio, mes + 1, 0).getDate();

    for (let i = 0; i < offset; i++) { grid.appendChild(document.createElement('div')); }

    for (let d = 1; d <= diasEnMes; d++) {
      const fecha = new Date(anio, mes, d);
      const fechaStr = fecha.toISOString().slice(0,10);
      const dia = document.createElement('div');
      dia.className = 'cal-dia';
      dia.textContent = d;
      
      const esDisponible = disponibilidadDisponible.has(fechaStr);
      const esHoy = fecha.getTime() === hoy.getTime();
      const esSeleccionada = fechaSeleccionada === fechaStr;
      const esPasado = fecha.getTime() < hoy.getTime();

      if (esPasado) {
        dia.classList.add('no-disponible');
        dia.style.cursor = 'not-allowed';
        dia.style.opacity = '0.4';
      } else if (esDisponible) {
        dia.classList.add('disponible');
        dia.onclick = () => seleccionarFecha(fechaStr, dia);
      } else {
        dia.classList.add('no-disponible');
        dia.style.cursor = 'not-allowed';
      }

      if (esHoy) dia.classList.add('hoy');
      if (esSeleccionada) dia.classList.add('seleccionado');

      grid.appendChild(dia);
    }
  }

  function seleccionarFecha(fechaStr, elemento) {
    fechaSeleccionada = fechaStr;
    document.getElementById('fecha-reserva').value = fechaStr;
    document.getElementById('fecha-seleccionada').textContent = 'Fecha seleccionada: ' + fechaStr;
    
    document.querySelectorAll('.cal-dia').forEach(d => d.classList.remove('seleccionado'));
    elemento.classList.add('seleccionado');
  }

  document.getElementById('form-nueva-reserva').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fecha = document.getElementById('fecha-reserva').value;
    const hora = document.getElementById('hora-reserva').value;
    const comensales = document.getElementById('comensales-reserva').value;
    const comentarios = document.getElementById('comentarios-reserva').value;

    if (!fecha || !hora || !comensales) {
      mostrarAlerta('alerta-nueva-reserva', 'Por favor completa fecha, hora y número de comensales.', 'error');
      return;
    }

    const btn = event.currentTarget.querySelector('button[type="submit"]');
    setBtnLoading(btn, true);

    try {
      const r = await api.mesas();
      const mesas = r.datos || [];
      const mesaDisponible = mesas.find(m => m.activo);
      
      if (!mesaDisponible) {
        mostrarAlerta('alerta-nueva-reserva', 'No hay mesas disponibles.', 'error');
        setBtnLoading(btn, false);
        return;
      }

      const horaFin = hora === '22:00' ? '23:00' : (parseInt(hora.split(':')[0]) + 1) + ':00';

      await api.crearReserva({
        id_mesa: mesaDisponible.id_mesa,
        fecha_reserva: fecha,
        hora_inicio: hora,
        hora_fin: horaFin,
        observaciones: comentarios
      });
      
      mostrarToast('Reserva creada exitosamente.', 'exito');
      document.getElementById('form-nueva-reserva').reset();
      document.getElementById('fecha-seleccionada').textContent = '';
      fechaSeleccionada = null;
      document.querySelectorAll('.cal-dia').forEach(d => d.classList.remove('seleccionado'));
      cargarMisReservas();
      mostrar('mis-reservas');
    } catch (err) {
      mostrarAlerta('alerta-nueva-reserva', err.message || 'Error al crear reserva.', 'error');
      setBtnLoading(btn, false);
    }
  });

  mostrar('mis-reservas');
</script>

</body>
</html>
