<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Productos — Green en la Casa Blanca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/componentes.css">
<link rel="stylesheet" href="assets/icons/icons.css">
<style>
  .panel-grid { display: grid; grid-template-columns: 260px 1fr; gap: 0; min-height: calc(100vh - 70px); }
  .panel-sidebar { background: var(--color-primary); color: #fff; padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .panel-sidebar .panel-brand { font-family: var(--font-heading); font-size: 1.35rem; letter-spacing: 2px; margin-bottom: 2rem; color: var(--color-accent); text-align: center; }
  .panel-sidebar a { display: block; padding: 0.75rem 1rem; border-radius: var(--radius-md); color: rgba(245,245,220,0.9); font-size: 0.95rem; transition: var(--transition); text-decoration: none; }
  .panel-sidebar a:hover, .panel-sidebar a.activo { background: rgba(245,245,220,0.15); color: #fff; }
  .panel-sidebar a.cerrar { color: rgba(168,54,54,0.9); margin-top: auto; }
  .panel-sidebar a.cerrar:hover { background: rgba(168,54,54,0.15); color: #a83636; }
  .panel-main { background: var(--color-bg); padding: 2rem var(--space-md); overflow-y: auto; }
  .panel-main h2 { font-size: 1.75rem; margin-bottom: 1.5rem; color: var(--color-primary); text-transform: uppercase; letter-spacing: 2px; }
  .panel-main .divisor { width: 60px; height: 3px; background: var(--color-accent); margin: 0 0 2rem 0; border-radius: 2px; }
  .panel-card { background: var(--color-surface); border: 1px solid rgba(27,67,50,0.12); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-sm); }
  .panel-card h3 { margin-top: 0; margin-bottom: 1rem; color: var(--color-primary); font-size: 1.15rem; text-transform: uppercase; letter-spacing: 1px; }
  .tabla-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid rgba(27,67,50,0.08); }
  th { background: rgba(46,95,78,0.08); color: var(--color-primary); font-weight: 700; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; }
  tr:hover { background: rgba(46,95,78,0.05); }
  .estado { padding: 0.25rem 0.6rem; border-radius: var(--radius-pill); font-size: 0.78rem; font-weight: 700; text-transform: uppercase; display: inline-block; }
  .estado--activo { background: rgba(45,106,79,0.15); color: #2d6a4f; }
  .estado--inactivo { background: rgba(168,54,54,0.12); color: #a83636; }
  .btn-accion { background: var(--color-primary); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .btn-accion:hover { background: var(--color-secondary); }
  .btn-accion.sec { background: transparent; border: 1px solid var(--color-primary); color: var(--color-primary); }
  .btn-accion.sec:hover { background: var(--color-primary); color: #fff; }
  .btn-accion.danger { background: transparent; border: 1px solid #a83636; color: #a83636; }
  .btn-accion.danger:hover { background: #a83636; color: #fff; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; font-weight: 600; color: var(--color-primary); margin-bottom: 0.5rem; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.75rem; border: 1px solid rgba(27,67,50,0.15); border-radius: var(--radius-md); font-size: 0.9rem; }
  .form-group input::placeholder { color: var(--color-text-muted); }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.1); }
  .imagen-preview { width: 100%; max-width: 200px; height: 150px; object-fit: cover; border-radius: var(--radius-md); margin-bottom: 0.5rem; border: 1px solid rgba(27,67,50,0.15); }
  .alerta { padding: 1rem; border-radius: var(--radius-md); margin-bottom: 1rem; font-size: 0.9rem; display: none; }
  .alerta--exito { background: rgba(45,106,79,0.1); color: #2d6a4f; border: 1px solid #2d6a4f; }
  .alerta--error { background: rgba(168,54,54,0.1); color: #a83636; border: 1px solid #a83636; }
  .vacio { text-align: center; color: var(--color-text-muted); padding: 3rem; }
  @media (max-width: 768px) { .panel-grid { grid-template-columns: 1fr; } .panel-sidebar { display: none; } }
</style>
</head>
<body>

<nav>
  <div class="nav-wrap">

    <a href="index.html" class="logo nav-brand">
      <img src="assets/icons/logo.png" alt="Logo Green en la Casa Blanca" width="40" height="40">
      <span class="logo-text">GREEN</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="carta.html">Carta</a></li>
      <li><a href="reservas.html">Reservar mesa</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>
    <div class="nav-acciones">
      <div id="nav-sesion"></div>
    </div>
  </div>
</nav>

<div class="panel-grid">
  <aside class="panel-sidebar">
    <div class="panel-brand">Administrador</div>
    <a href="#" class="activo">Gestión de Productos</a>
    <a href="#" class="cerrar" onclick="cerrarSesion()">Cerrar sesión</a>
  </aside>
  <main class="panel-main">
    
    <section class="panel-card">
      <h2>Gestión de Productos</h2>
      <div id="alerta-productos" class="alerta" style="display:none;"></div>
      
      <div class="form-grid">
        <div style="grid-column: 1 / -1;">
          <label>Nombre del producto</label>
          <input type="text" id="inp-nombre" placeholder="Ej. Lomo saltado">
        </div>
        <div>
          <label>Categoría</label>
          <select id="inp-categoria">
            <option value="Entradas">Entradas</option>
            <option value="Principales">Principales</option>
            <option value="Postres">Postres</option>
            <option value="Bebidas">Bebidas</option>
          </select>
        </div>
        <div>
          <label>Precio ($)</label>
          <input type="number" id="inp-precio" min="0" step="0.01" placeholder="0.00">
        </div>
        <div>
          <label>URL de imagen (opcional)</label>
          <input type="text" id="inp-imagen-url" placeholder="https://ejemplo.com/imagen.jpg">
        </div>
        <div style="grid-column: 1 / -1; display:flex; gap:0.5rem;">
          <button type="button" class="btn btn-submit" id="btn-guardar-producto">Guardar Producto</button>
          <button type="button" class="btn btn-accion sec" id="btn-limpiar-form">Limpiar</button>
        </div>
      </div>
      
      <h3 style="margin-top: 2rem;">Productos Existentes</h3>
      <div class="tabla-wrap" id="tabla-productos"></div>
      
    </section>

  </main>
</div>

<script type="module" src="assets/js/api.js?v=2"></script>
<script type="module" src="assets/js/main.js"></script>
<script type="module">
  import { api } from './api.js';

  let productos = [];

  async function cargarProductos() {
    try {
      const r = await api.productos();
      if (r.exito) {
        productos = r.datos || [];
        renderTabla();
      } else {
        alerta('alerta-productos', r.mensaje || 'Error al cargar productos.', 'error');
      }
    } catch (e) {
      alerta('alerta-productos', 'Error al cargar productos: ' + e.message, 'error');
    }
  }

  function renderTabla() {
    const wrap = document.getElementById('tabla-productos');
    if (!productos.length) {
      wrap.innerHTML = '<p class="vacio">No hay productos registrados.</p>';
      return;
    }
    let html = '<table><thead><tr><th>Imagen</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Estado</th><th>Acción</th></tr></thead><tbody>';
    productos.forEach(p => {
      const img = p.imagen_url ? `<img src="${p.imagen_url}" class="imagen-preview" alt="${escapeHtml(p.nombre)}">` : '<span class="sin-imagen">Sin imagen</span>';
      html += `<tr>
        <td>${img}</td>
        <td>${escapeHtml(p.nombre)}</td>
        <td>${p.categoria}</td>
        <td>$${(p.precio || 0).toFixed(2)}</td>
        <td><span class="estado estado--${p.activo ? 'activo' : 'inactivo'}">${p.activo ? 'Activo' : 'Inactivo'}</span></td>
        <td>
          <button class="btn-sm btn-accion" onclick="eliminarProducto(${p.id_producto})">${p.activo ? 'Desactivar' : 'Activar'}</button>
        </td>
      </tr>`;
    });
    html += '</tbody></table>';
    wrap.innerHTML = html;
  }

  document.getElementById('btn-guardar-producto').addEventListener('click', async () => {
    const nombre = document.getElementById('inp-nombre').value.trim();
    const categoria = document.getElementById('inp-categoria').value;
    const precio = parseFloat(document.getElementById('inp-precio').value) || 0;
    const imagenUrl = document.getElementById('inp-imagen-url').value.trim() || null;

    if (!nombre) {
      alerta('alerta-productos', 'El nombre es obligatorio.', 'error');
      return;
    }

    try {
      await api._request('/api/productos', {
        method: 'POST',
        body: JSON.stringify({ nombre, precio, categoria, imagen_url: imagenUrl })
      });
      alerta('alerta-productos', 'Producto guardado correctamente.', 'exito');
      document.getElementById('inp-nombre').value = '';
      document.getElementById('inp-precio').value = '';
      document.getElementById('inp-imagen-url').value = '';
      document.getElementById('inp-categoria').value = 'Entradas';
      cargarProductos();
    } catch (e) {
      alerta('alerta-productos', e.message || 'Error al guardar producto.', 'error');
    }
  });

  document.getElementById('btn-limpiar-form').addEventListener('click', () => {
    document.getElementById('inp-nombre').value = '';
    document.getElementById('inp-precio').value = '';
    document.getElementById('inp-imagen-url').value = '';
    document.getElementById('inp-categoria').value = 'Entradas';
  });

  window.eliminarProducto = async function (id) {
    if (!confirm('¿Eliminar este producto?')) return;
    try {
      await api._request(`/productos/${id}`, {
        method: 'DELETE'
      });
      alerta('alerta-productos', 'Producto eliminado correctamente.', 'exito');
      cargarProductos();
    } catch (e) {
      alerta('alerta-productos', e.message || 'Error al eliminar producto.', 'error');
    }
  };

  function alerta(id, texto, tipo) {
    const el = document.getElementById(id);
    el.textContent = texto;
    el.className = 'alerta alerta--' + tipo;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 5000);
  }

  function escapeHtml(texto) {
    const d = document.createElement('div'); d.textContent = texto; return d.innerHTML;
  }

  cargarProductos();
</script>

</body>
</html>
