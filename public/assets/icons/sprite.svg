<!--
  Sprite de iconos — Green en la Casa Blanca
  Estilo: lineal elegante, trazo 2px, esquinas redondeadas
  Colores de marca controlados por CSS (currentColor)
  Uso: <svg class="icon icon--telefono"><use href="#icon-telefono"></use></svg>
  
  Fuentes externas:
  - icon-telefono: Lucide Icons (lucide-icons/lucide)
  - icon-whatsapp: Tabler Icons (tabler/tabler-icons)
  - icon-pedido: Lucide Icons (lucide-icons/lucide)
  - icon-copa: Lucide Icons (lucide-icons/lucide)
  - Los demás: diseño propio adaptado a la identidad de marca
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- Logo / Monograma — Edificio neoclásico (de 8.jpeg en referencias) -->
  <symbol id="icon-logo-monograma" viewBox="0 0 24 24">
    <circle cx="12" cy="11" r="9"/>
    <path d="M6 11 L12 5 L18 11"/>
    <line x1="8" y1="11" x2="8" y2="17"/>
    <line x1="12" y1="11" x2="12" y2="17"/>
    <line x1="16" y1="11" x2="16" y2="17"/>
    <line x1="6" y1="17" x2="18" y2="17"/>
    <rect x="10" y="14" width="4" height="3" rx="0.5"/>
    <rect x="11" y="8" width="2" height="2"/>
  </symbol>

  <!-- Teléfono (externo: Lucide Icons) -->
  <symbol id="icon-telefono" viewBox="0 0 24 24">
    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Ubicación (diseño propio) -->
  <symbol id="icon-ubicacion" viewBox="0 0 24 24">
    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="10" r="3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Email (diseño propio) -->
  <symbol id="icon-email" viewBox="0 0 24 24">
    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="22,6 12,13 2,6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- WhatsApp (externo: Tabler Icons) -->
  <symbol id="icon-whatsapp" viewBox="0 0 24 24">
    <path d="M3 21l1.65 -3.8a9 9 0 1 1 3.4 2.9l-5.05 .9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M9 10a.5 .5 0 0 0 1 0v-1a.5 .5 0 0 0 -1 0v1a5 5 0 0 0 5 5h1a.5 .5 0 0 0 0 -1h-1a.5 .5 0 0 0 0 1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Reloj (diseño propio) -->
  <symbol id="icon-reloj" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="12,6 12,12 16,14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Calendario (diseño propio) -->
  <symbol id="icon-calendario" viewBox="0 0 24 24">
    <rect x="3" y="4" width="18" height="18" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="16" y1="2" x2="16" y2="6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="8" y1="2" x2="8" y2="6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="3" y1="10" x2="21" y2="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Menú (diseño propio) -->
  <symbol id="icon-menu" viewBox="0 0 24 24">
    <line x1="3" y1="12" x2="21" y2="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="3" y1="6" x2="21" y2="6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="3" y1="18" x2="21" y2="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Usuario (diseño propio) -->
  <symbol id="icon-usuario" viewBox="0 0 24 24">
    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Pedido / Ticket (externo: Lucide Icons) -->
  <symbol id="icon-pedido" viewBox="0 0 24 24">
    <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M13 5v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M13 17v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M13 11v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Instagram (diseño propio) -->
  <symbol id="icon-instagram" viewBox="0 0 24 24">
    <rect x="2" y="2" width="20" height="20" rx="5" ry="5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="17.5" y1="17.5" x2="17.51" y2="17.51" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Facebook (diseño propio) -->
  <symbol id="icon-facebook" viewBox="0 0 24 24">
    <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" fill="currentColor"/>
  </symbol>

  <!-- Copa / Vino (externo: Lucide Icons) -->
  <symbol id="icon-copa" viewBox="0 0 24 24">
    <path d="M8 22h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M7 10h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 15v7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 15a5 5 0 0 0 5-5c0-2-.5-4-2-8H9c-1.5 4-2 6-2 8a5 5 0 0 0 5 5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Plato — Tenedor y cuchillo cruzados (de plato_convertirasvgyluegoborrar.png) -->
  <symbol id="icon-plato" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10"/>
    <line x1="8" y1="7" x2="8" y2="16"/>
    <line x1="9" y1="7" x2="9" y2="13"/>
    <line x1="10" y1="7" x2="10" y2="13"/>
    <line x1="11" y1="7" x2="11" y2="13"/>
    <line x1="8" y1="16" x2="10" y2="18"/>
    <line x1="16" y1="7" x2="16" y2="16"/>
    <line x1="16" y1="16" x2="14" y2="18"/>
    <path d="M16 7 Q18 10 16 16"/>
  </symbol>

  <!-- Flecha derecha (diseño propio) -->
  <symbol id="icon-flecha-derecha" viewBox="0 0 24 24">
    <polyline points="9,18 15,12 9,6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Cerrar (X) (diseño propio) -->
  <symbol id="icon-cerrar" viewBox="0 0 24 24">
    <line x1="18" y1="6" x2="6" y2="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="6" y1="6" x2="18" y2="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Check / éxito (diseño propio) -->
  <symbol id="icon-check" viewBox="0 0 24 24">
    <polyline points="20,6 9,17 4,12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Estrella (diseño propio) -->
  <symbol id="icon-estrella" viewBox="0 0 24 24">
    <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26 12,2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>
