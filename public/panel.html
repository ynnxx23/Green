<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel — Green en la Casa Blanca</title>
<script type="module" src="assets/js/api.js?v=3"></script>
<script type="module">
  import { api } from './assets/js/api.js?v=3';

  async function iniciar() {
    try {
      const sesion = await api.sesion();
      if (!sesion.exito) { window.location.href = 'login.html'; return; }
      const rol = sesion.datos.id_rol;
      if (rol === 1) window.location.href = 'panel-cliente.html';
      else if (rol === 2 || rol === 3 || rol === 4) window.location.href = 'panel-encargado.html';
      else window.location.href = 'panel-cliente.html';
    } catch (err) {
      window.location.href = 'login.html';
    }
  }

  iniciar();
</script>
</head>
<body>
  <!-- Redirigiendo... -->
</body>
</html>
