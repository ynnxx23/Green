<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel — Green en la Casa Blanca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/componentes.css">
<link rel="stylesheet" href="assets/icons/icons.css">
<style>
  .panel-grid { display: grid; grid-template-columns: 260px 1fr; gap: 0; min-height: calc(100vh - 70px); }
  .panel-sidebar { background: var(--color-primary); color: #fff; padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .panel-sidebar .panel-brand { font-family: var(--font-heading); font-size: 1.35rem; letter-spacing: 2px; margin-bottom: 2rem; color: var(--color-accent); text-align: center; }
  .panel-sidebar a { display: block; padding: 0.75rem 1rem; border-radius: var(--radius-md); color: rgba(245,245,220,0.9); font-size: 0.95rem; transition: var(--transition); text-decoration: none; }
  .panel-sidebar a:hover, .panel-sidebar a.activo { background: rgba(245,245,220,0.15); color: #fff; }
  .panel-sidebar a.cerrar { color: rgba(168,54,54,0.9); margin-top: auto; }
  .panel-sidebar a.cerrar:hover { background: rgba(168,54,54,0.15); color: #a83636; }
  .panel-main { background: var(--color-bg); padding: 2rem var(--space-md); overflow-y: auto; }
  .panel-main h2 { font-size: 1.75rem; margin-bottom: 1.5rem; color: var(--color-primary); text-transform: uppercase; letter-spacing: 2px; }
  .panel-main .divisor { width: 60px; height: 3px; background: var(--color-accent); margin: 0 0 2rem 0; border-radius: 2px; }
  .panel-card { background: var(--color-surface); border: 1px solid rgba(27,67,50,0.12); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-sm); }
  .panel-card h3 { margin-top: 0; margin-bottom: 1rem; color: var(--color-primary); font-size: 1.15rem; text-transform: uppercase; letter-spacing: 1px; }
  .tabla-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid rgba(27,67,50,0.08); }
  th { background: rgba(46,95,78,0.08); color: var(--color-primary); font-weight: 700; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; }
  tr:hover { background: rgba(46,95,78,0.05); }
  .estado { padding: 0.25rem 0.6rem; border-radius: var(--radius-pill); font-size: 0.78rem; font-weight: 700; text-transform: uppercase; display: inline-block; }
  .estado--pendiente { background: rgba(184,134,11,0.12); color: #8a6200; }
  .estado--confirmada, .estado--en_preparacion { background: rgba(46,95,78,0.12); color: #1e4a33; }
  .estado--listo, .estado--entregado, .estado--completada { background: rgba(45,106,79,0.15); color: #2d6a4f; }
  .estado--cancelada, .estado--vencida, .estado--cancelado { background: rgba(168,54,54,0.12); color: #a83636; }
  .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; border-radius: var(--radius-sm); }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
  .producto-card { border: 1px solid rgba(27,67,50,0.12); border-radius: var(--radius-md); padding: 1rem; background: #fff; display: flex; flex-direction: column; gap: 0.5rem; }
  .producto-card h4 { margin: 0; font-size: 1rem; color: var(--color-primary); }
  .producto-card p { margin: 0; font-size: 0.85rem; color: var(--color-text-muted); flex: 1; }
  .producto-card .precio { font-weight: 700; color: var(--color-accent); }
  .cantidad { display: flex; align-items: center; gap: 0.5rem; }
  .cantidad input { width: 45px; padding: 0.35rem; border: 1px solid rgba(27,67,50,0.15); border-radius: var(--radius-sm); text-align: center; }
  .vacio { text-align: center; color: var(--color-text-muted); padding: 3rem; }
  .alerta { padding: 1rem; border-radius: var(--radius-md); margin-bottom: 1rem; font-size: 0.9rem; }
  .alerta--exito { background: rgba(45,106,79,0.1); color: #2d6a4f; border: 1px solid #2d6a4f; }
  .alerta--error { background: rgba(168,54,54,0.1); color: #a83636; border: 1px solid #a83636; }
  @media (max-width: 768px) { .panel-grid { grid-template-columns: 1fr; } .panel-sidebar { display: none; } }
</style>
</head>
<body>
<nav>
  <div class="nav-wrap">
    <button class="btn-menu" data-menu-toggle aria-label="Abrir menú" aria-expanded="false">☰</button>
    <a href="index.html" class="logo nav-brand">
      <img src="assets/icons/logo.png" alt="Logo Green en la Casa Blanca" width="40" height="40">
      <span class="logo-text">GREEN</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="carta.html">Carta</a></li>
      <li><a href="reservas.html">Reservas</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>
    <div class="nav-acciones">
      <div id="nav-sesion"></div>
    </div>
  </div>
</nav>

<div id="panel-despacho">
  <div class="panel-card" style="max-width: 560px; margin: 2rem auto; text-align: center;">
    <div style="font-size: 2.5rem; margin-bottom: 1rem;">🔄</div>
    <h2>Cargando panel...</h2>
    <p id="panel-mensaje">Verificando sesión y rol de usuario.</p>
  </div>
</div>

<script type="module" src="assets/js/api.js"></script>
<script type="module" src="assets/js/main.js"></script>
<script type="module">
  import { api } from './api.js';

  const despacho = document.getElementById('panel-despacho');
  const mensaje = document.getElementById('panel-mensaje');

  async function iniciar() {
    try {
      const sesion = await api.sesion();
      if (!sesion.exito) { window.location.href = 'login.html'; return; }
      const rol = sesion.datos.id_rol;
      // 1 = cliente, 2 = mesero, 3 = cocinero, 4 = administrador
      if (rol === 1) window.location.href = 'panel-cliente.html';
      else if (rol === 2 || rol === 3) window.location.href = 'panel-encargado.html';
      else if (rol === 4) window.location.href = 'panel-admin.html';
      else window.location.href = 'login.html';
    } catch (err) {
      mensaje.textContent = 'No se pudo verificar la sesión. Inicie sesión.';
      mensaje.style.color = '#a83636';
      setTimeout(() => { window.location.href = 'login.html'; }, 1200);
    }
  }

  iniciar();
</script>
</body>
</html>
