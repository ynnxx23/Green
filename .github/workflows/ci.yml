name: Integración Continua

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: restaurante_test
          MYSQL_USER: restaurante
          MYSQL_PASSWORD: restaurante
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, openssl, session, json, filter
          coverage: none

      - name: Validar sintaxis PHP
        run: |
          find . -name '*.php' ! -path './vendor/*' ! -path './documentacion_desarrollo/*' -print0 | xargs -0 -I {} php -l {}

      - name: Validar sintaxis JavaScript
        run: |
          node --check public/assets/js/api.js
          node --check public/assets/js/auth.js
          node --check public/assets/js/ui.js
          node --check public/assets/js/app.js
          node --check public/assets/js/vistas.js

      - name: Aplicar migraciones de base de datos
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: restaurante_test
          DB_USER: restaurante
          DB_PASSWORD: restaurante
        run: |
          for f in migrations/001_create_schema.sql migrations/002_migraciones_control.sql migrations/003_datos_iniciales.sql migrations/004_stock_y_disponibilidad.sql migrations/005_pedidos_y_senas.sql migrations/006_historial_y_reportes.sql migrations/007_datos_prueba.sql migrations/008_recuperar_contrasena_y_perfil.sql migrations/009_configuracion_y_limites_pedidos.sql migrations/010_cupones_descuento.sql migrations/011_calificaciones_preferencias_fidelidad.sql migrations/012_delivery_repartidores.sql migrations/013_rf_pendientes.sql migrations/014_cloudinary_imagenes_productos.sql migrations/015_datos_prueba_completos.sql migrations/016_datos_finales.sql migrations/017_reparacion_productos.sql migrations/018_pedidos_saldo_numero.sql; do
            mysql -h 127.0.0.1 -P 3306 -u restaurante -prestaurante restaurante_test < "$f" || echo "Migración $f omitida (ya aplicada o incompatibilidad de prueba)";
          done

      - name: Ejecutar prueba de humo (smoke test)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: restaurante_test
          DB_USER: restaurante
          DB_PASSWORD: restaurante
          APP_ENV: testing
          APP_URL: http://localhost
          SESSION_COOKIE_SECURE: 0
          SESSION_COOKIE_SAMESITE: Lax
        run: |
          php -S 127.0.0.1:8080 -t public > /tmp/php_server.log 2>&1 &
          PHP_PID=$!
          sleep 2

          # Verificar que el servidor responde
          curl -sf http://127.0.0.1:8080/ > /dev/null || { cat /tmp/php_server.log; exit 1; }

          # Verificar endpoint de autenticación (registro)
          curl -sf -X POST http://127.0.0.1:8080/api/auth/registro \
            -H 'Content-Type: application/json' \
            -d '{"nombre":"Usuario Prueba","email":"prueba@test.local","contrasena":"Password123"}' > /dev/null || { cat /tmp/php_server.log; exit 1; }

          # Verificar endpoint de áreas
          curl -sf http://127.0.0.1:8080/api/areas > /dev/null || { cat /tmp/php_server.log; exit 1; }

          # Verificar endpoint de mesas (requiere id_area, debería devolver 400)
          curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/mesas | grep -q "400" || { cat /tmp/php_server.log; exit 1; }

          # Verificar endpoint de stock (RF-78)
          curl -sf http://127.0.0.1:8080/api/admin/stock > /dev/null || { cat /tmp/php_server.log; exit 1; }

          # Verificar endpoint de cupones (RF-88)
          curl -sf http://127.0.0.1:8080/api/cupones > /dev/null || { cat /tmp/php_server.log; exit 1; }

          # Verificar endpoint de calificaciones (RF-91)
          curl -sf http://127.0.0.1:8080/api/calificaciones > /dev/null || { cat /tmp/php_server.log; exit 1; }

          # Verificar endpoint de configuración (RF-101)
          curl -sf http://127.0.0.1:8080/api/configuracion > /dev/null || { cat /tmp/php_server.log; exit 1; }

          # Verificar endpoint de productos/carta (público)
          curl -sf http://127.0.0.1:8080/api/productos > /dev/null || { cat /tmp/php_server.log; exit 1; }

          # Verificar endpoint de categorías
          curl -sf http://127.0.0.1:8080/api/productos/categorias > /dev/null || { cat /tmp/php_server.log; exit 1; }

          # Verificar endpoint de reservas (requiere auth, devuelve 401 sin sesión)
          curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/reservas | grep -q "401" || { cat /tmp/php_server.log; exit 1; }

          # Verificar endpoint de pedidos (requiere auth, devuelve 401 sin sesión)
          curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/pedidos | grep -q "401" || { cat /tmp/php_server.log; exit 1; }

          kill $PHP_PID

      - name: Comprobar que no hay secretos hardcodeados
        run: |
          if grep -rEi '(password|secret|api_key|token)\s*=\s*["'"'"'][^"'"'"']{4,}' --include='*.php' --include='*.js' . --exclude-dir=vendor --exclude-dir=documentacion/desarrollo --exclude='.env.example'; then
            echo "Posibles secretos hardcodeados encontrados."
            exit 1
          fi
